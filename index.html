<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Integração Nano</title>
    <link rel="icon" href="https://github.com/ThiMnano/mlIntegracao/blob/main/Profile.ico?raw=true">
    <style>
        :root {
            --p: #2563eb;
            --bg: #eef4ff;
            --card: #fff;
            --txt: #1f2937;
            --ok: #16a34a
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --txt: #f3f4f6
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Segoe UI, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg), #c7d2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--txt)
        }

        .card {
            background: var(--card);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
            max-width: 520px;
            width: 92%;
            text-align: center;
            animation: fade .4s
        }

        img{
            width:380px;
            max-width:80%;
            height:auto;
            margin-bottom:20px;
            filter:drop-shadow(0 10px 25px rgba(37,99,235,.18));
            transition:transform .25s ease;
        }

        img:hover{
            transform:scale(1.03);
        }

        .code{
            margin:22px 0;
            padding:18px 20px;

            border:2px dashed #3b82f6;
            border-radius:14px;
            background:rgba(37,99,235,.05);

            font-family:Consolas, "Courier New", monospace;
            font-size:22px;
            font-weight:600;
            letter-spacing:.5px;
            line-height:1.5;

            white-space:nowrap;
            overflow-x:auto;
            overflow-y:hidden;

            cursor:pointer;
            user-select:all;
            text-align:left;

            scrollbar-width:none;      /* Firefox */
            -ms-overflow-style:none;   /* IE */
        }

        .code::-webkit-scrollbar{
            display:none;              /* Chrome, Edge e Safari */
        }

        .code:hover{
            border-color:#4f8cff;
            background:rgba(37,99,235,.08);
        }

        button {
            background: var(--p);
            color: #fff;
            border: 0;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: .2s
        }

        button:hover {
            transform: translateY(-2px)
        }

        small {
            display: block;
            margin-top: 18px;
            color: #6b7280
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--ok);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            transition: .3s
        }

        .toast.show {
            transform: translateX(-50%) translateY(0)
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: scale(.95)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://raw.githubusercontent.com/ThiMnano/mlIntegracao/refs/heads/main/Logo.svg" alt="Nano">
        <h2>Integração Nano</h2>
        <p>Copie o código abaixo e cole no sistema.</p>
        <div id="code" class="code">Carregando...</div>
        <button id="btn">📋 Copiar código</button>
        <small id="msg">Após copiar, volte ao Nano.</small>
    </div>
    <div id="toast" class="toast">Código copiado com sucesso!</div>
    <script>
        const p = new URLSearchParams(location.search);
        const code = (p.get("code") || "").trim();
        const el = document.getElementById("code"), btn = document.getElementById("btn"), msg = document.getElementById("msg");
        if (!code) { el.textContent = "Nenhum código recebido"; btn.disabled = true; msg.textContent = "Solicite uma nova integração."; }
        else el.textContent = code;
        function toast(t) { const x = document.getElementById("toast"); x.textContent = t; x.classList.add("show"); setTimeout(() => x.classList.remove("show"), 2200); }
        async function copy() {
            if (!code) return;
            try { await navigator.clipboard.writeText(code); }
            catch (e) {
                const i = document.createElement("input"); i.value = code; document.body.appendChild(i); i.select(); document.execCommand("copy"); i.remove();
            }
            toast("Código copiado com sucesso!");
        }
        btn.onclick = copy; el.onclick = copy;
        if (code) setTimeout(copy, 300);
    </script>
</body>

</html>
